services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: triflow
      POSTGRES_PASSWORD: triflow
      POSTGRES_DB: triflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command: [
      "-path=/migrations",
      "-database=postgres://triflow:triflow@postgres:5432/triflow?sslmode=disable",
      "up"
    ]
    restart: on-failure

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: development
      APP_PORT: "8080"
      APP_LOG_LEVEL: info
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: triflow
      DB_PASSWORD: triflow
      DB_NAME: triflow
      DB_SSLMODE: disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: "dev-secret-change-me-please-change-me"
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 168h
      RATELIMIT_AUTH_RPM: "20"
      CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "8080:8080"

volumes:
  pgdata:
